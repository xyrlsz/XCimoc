name: Android CI (commit)

on:
  workflow_dispatch:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "zulu"
          cache: gradle

      - name: Create keystore file from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/xcimoc.jks

      - name: Grant execute permission for build.sh
        run: chmod +x build.sh

      - name: Build with build.sh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build.sh

      - name: Upload APK (full arm64-v8a)
        uses: actions/upload-artifact@v6
        with:
          name: app-full-arm64-v8a-release
          path: app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

      - name: Upload APK (full armeabi-v7a)
        uses: actions/upload-artifact@v6
        with:
          name: app-full-armeabi-v7a-release
          path: app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk

      - name: Upload APK (full universal)
        uses: actions/upload-artifact@v6
        with:
          name: app-full-universal-release
          path: app/build/outputs/apk/full/release/app-full-universal-release.apk

      - name: Upload APK (full x86_64)
        uses: actions/upload-artifact@v6
        with:
          name: app-full-x86_64-release
          path: app/build/outputs/apk/full/release/app-full-x86_64-release.apk

      - name: Upload APK (full x86)
        uses: actions/upload-artifact@v6
        with:
          name: app-full-x86-release
          path: app/build/outputs/apk/full/release/app-full-x86-release.apk

      - name: Upload APK (lite arm64-v8a)
        uses: actions/upload-artifact@v6
        with:
          name: app-lite-arm64-v8a-release
          path: app/build/outputs/apk/lite/release/app-lite-arm64-v8a-release.apk

      - name: Upload APK (lite armeabi-v7a)
        uses: actions/upload-artifact@v6
        with:
          name: app-lite-armeabi-v7a-release
          path: app/build/outputs/apk/lite/release/app-lite-armeabi-v7a-release.apk

      - name: Upload APK (lite universal)
        uses: actions/upload-artifact@v6
        with:
          name: app-lite-universal-release
          path: app/build/outputs/apk/lite/release/app-lite-universal-release.apk

      - name: Upload APK (lite x86_64)
        uses: actions/upload-artifact@v6
        with:
          name: app-lite-x86_64-release
          path: app/build/outputs/apk/lite/release/app-lite-x86_64-release.apk

      - name: Upload APK (lite x86)
        uses: actions/upload-artifact@v6
        with:
          name: app-lite-x86-release
          path: app/build/outputs/apk/lite/release/app-lite-x86-release.apk
