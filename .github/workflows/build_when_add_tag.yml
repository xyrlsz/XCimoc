name: Android CI (tag)

on:
  push:
    tags:
      # 姝ｅ紡鐗堬細鏅€?v* tag锛堟帓闄ら瑙堝悗缂€锛岄瑙堢増璧?
      # build_when_add_preview_tag.yml 鍙戝竷涓?Pre-release锛?
      - "v*"
      - "!v*-preview*"
      - "!v*-beta*"
    # branches: ["main"]

# ---------------------------------------------------------------------
# Go 鏈嶅姟鍣ㄦ墦鍖呯瓥鐣?
#
# 路 榛樿 SQLite 椹卞姩鏄?gorm.io/driver/sqlite锛堝簳灞?mattn/go-sqlite3锛夛紝蹇?CGO銆?
# 路 鐩存帴涓€濂椾簩杩涘埗锛欳GO_ENABLED=1 + go build锛堜笉浣跨敤 ObjectBox锛夈€?
# 路 database.type 閰嶇疆椤瑰彲閫夛細sqlite / mysql / postgres銆?
#
# 骞冲彴鑼冨洿锛堜粎 Linux + Windows锛夛細
#   linux/amd64     ubuntu-latest + 鍘熺敓 gcc
#   linux/arm64     ubuntu-latest + gcc-aarch64-linux-gnu 浜ゅ弶宸ュ叿閾?
#   windows/amd64   windows-latest + MinGW-w64
#
# macOS 鐢ㄦ埛鑻ラ渶瑕佷簩杩涘埗锛屾寜浠撳簱 README 鐨勬寚寮曠敤 data_server/build.sh 鏈湴鏋勫缓鍗冲彲
# 锛圖arwin 鍘熺敓锛歜rew install go gcc ; ./build.sh锛夛紝CI 涓嶅啀鎵?darwin 浠ラ伩鍏?
# osxcross/ld64 缁存姢鎴愭湰銆?
# ---------------------------------------------------------------------

jobs:
  # ============================================================
  # 1) Go 鏈嶅姟鍣紙缁熶竴鏋勫缓锛?
  #    鐙珛 job銆佺嫭绔?runner锛屼笉涓?APK/Keystore/gradlew 娣凤紝
  #    杩欐牱鍗充究 APK 鏋勫缓鍗′綇锛孏o 浜岃繘鍒朵粛鑳藉崟鐙嚭鏉ャ€?
  # ============================================================
  build-data-server:
    name: "Data Server 路 ${{ matrix.label }}"
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: x86_64-linux-gnu-gcc
            install_cmd: |
              set -eux
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl
            ext: ""

          - label: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            install_cmd: |
              set -eux
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl \
                gcc-aarch64-linux-gnu \
                libc6-dev-arm64-cross
            ext: ""

          - label: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc
            install_cmd: |
              $ErrorActionPreference = "Continue"
              # 1) MinGW-w64 gcc锛氫緷娆″皾璇曞父瑙佸畨瑁呰矾寰勶紙runner 鍙兘棰勮 msys2锛?
              $candidates = @(
                "C:\ProgramData\mingw64\bin",
                "C:\Program Files\mingw-w64\x86_64-8.1.0-posix-seh-rt_v6-rev0\mingw64\bin",
                "C:\msys64\ucrt64\bin",
                "C:\msys64\mingw64\bin",
                "C:\tools\msys64\ucrt64\bin",
                "C:\tools\msys64\mingw64\bin"
              )
              $found = $null
              foreach ($p in $candidates) { if (Test-Path (Join-Path $p "gcc.exe")) { $found = $p; break } }
              if (-not $found) {
                choco install -y mingw --prefer-binary --no-progress --timeout 600 || $null
                foreach ($p in $candidates) { if (Test-Path (Join-Path $p "gcc.exe")) { $found = $p; break } }
              }
              if (-not $found) {
                foreach ($msys in @("C:\msys64","C:\tools\msys64")) {
                  if (-not (Test-Path $msys)) { continue }
                  & "$msys\usr\bin\bash.exe" -lc "pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-gcc" || $null
                  $ucrt = "$msys\ucrt64\bin"
                  if (Test-Path (Join-Path $ucrt "gcc.exe")) { $found = $ucrt; break }
                }
              }
              if (-not $found) { throw "MinGW-w64 gcc not found on this runner." }
              Write-Host "FOUND gcc at: $found"
              echo $found | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.25"
          cache-dependency-path: data_server/go.sum

      - name: Install toolchain (${{ matrix.label }})
        working-directory: data_server
        run: ${{ matrix.install_cmd }}

      - name: Sanity go list packages
        working-directory: data_server
        shell: bash
        run: |
          set -eux
          go list ./... > /dev/null

      - name: Build data_server (${{ matrix.label }})
        working-directory: data_server
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          set -eux
          mkdir -p dist
          BIN="dist/xcimoc-data-server-${{ matrix.label }}${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$BIN" .
          ls -lh dist/
          echo "BIN_PATH=data_server/$BIN" >> "$GITHUB_ENV"

      - name: Upload artifact ${{ matrix.label }}
        uses: actions/upload-artifact@v6
        with:
          name: data-server-${{ matrix.label }}
          path: ${{ env.BIN_PATH }}

  # ============================================================
  # 2) APK 鏋勫缓 + 涓婁紶榛樿浜х墿锛坈onfig.example.yaml 绛夛級
  #    杩欓儴鍒嗕笌鍘熼€昏緫淇濇寔涓€鑷达紝鍙槸涓嶅啀娣锋墦 Go 浜岃繘鍒躲€?
  # ============================================================
  build-and-github-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-data-server # 鍏堢‘璁?Go 3 涓洰鏍囬兘 OK锛屽啀寤?Release锛堥伩鍏嶇┖ Release锛?

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "zulu"
          cache: gradle

      - name: Get Git commit hash
        id: git_commit_hash
        run: echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get Repository Info
        run: |
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          REPO_OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          echo "GIT_REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "GIT_REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.25"
          cache-dependency-path: data_server/go.sum

      # 鍙礋璐ｆ妸 data_server 鐨勯厤缃ず渚嬪拰 3 涓簩杩涘埗锛堜粠 artifact 涓嬭浇鍥炴潵锛?
      # 鏀捐繘 data_server/dist/ 鐩綍锛屼緵鏈€缁?action-gh-release 涓€娆℃€т笂浼犮€?
      - name: Collect Go server artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: data-server-*
          path: data_server/dist_raw/
          merge-multiple: true

      - name: Stage data_server/dist for release
        run: |
          set -eux
          cd data_server
          mkdir -p dist
          # 鎶婂悇 artifact 鎵佸钩鍖栧埌 dist/
          if [ -d dist_raw ]; then
            find dist_raw -maxdepth 2 -type f -exec cp -f {} dist/ \;
          fi
          cp -f config.example.yaml dist/
          ls -lh dist/

      - name: Upload Data Sync Server as artifact (batch)
        uses: actions/upload-artifact@v6
        with:
          name: data-server-binaries
          path: data_server/dist/

      - name: Create keystore file from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/xcimoc.jks

      - name: Grant execute permission for build.sh
        run: chmod +x build.sh

      - name: Build APK with build.sh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build.sh

      - name: Upload APK as artifact (for Gitee job)
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-release
          path: |
            app/build/outputs/apk/full/release/app-full-universal-release.apk
            app/build/outputs/apk/lite/release/app-lite-universal-release.apk

      - name: Extract latest changelog
        run: python3 scripts/extract_changelog.py

      # 杩欓噷涓€娆℃€ф妸 APK + Go 浜岃繘鍒?+ config 绀轰緥 鎸傚埌 Release 涓娿€?
      # 娉ㄦ剰锛歞ata_server/dist/* 宸插湪 build-data-server job 涓€氳繃 append release
      #       鍗曠嫭杩藉姞杩囦竴娆★紱杩欓噷鍐嶅啓涓€娆℃枃浠舵竻鍗曟槸涓轰簡鍏煎銆屾煇浜涙爣绛惧厛鍑?
      #       APK 鍚庡嚭 Go 浜岃繘鍒躲€嶇殑 case锛屽苟淇濊瘉 config.example.yaml 涓€瀹氳繘 Release銆?
      - name: Create GitHub Release (APK + Go binaries batch)
        uses: softprops/action-gh-release@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          prerelease: false
          body_path: release_body.md
          files: |
            app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk
            app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk
            app/build/outputs/apk/full/release/app-full-universal-release.apk
            app/build/outputs/apk/full/release/app-full-x86_64-release.apk
            app/build/outputs/apk/full/release/app-full-x86-release.apk
            app/build/outputs/apk/lite/release/app-lite-arm64-v8a-release.apk
            app/build/outputs/apk/lite/release/app-lite-armeabi-v7a-release.apk
            app/build/outputs/apk/lite/release/app-lite-universal-release.apk
            app/build/outputs/apk/lite/release/app-lite-x86_64-release.apk
            app/build/outputs/apk/lite/release/app-lite-x86-release.apk
            data_server/dist/xcimoc-data-server-linux-amd64
            data_server/dist/xcimoc-data-server-linux-arm64
            data_server/dist/xcimoc-data-server-linux-amd64-musl
            data_server/dist/xcimoc-data-server-linux-arm64-musl
            data_server/dist/xcimoc-data-server-windows-amd64.exe
            data_server/dist/config.example.yaml

  # ============================================================
  # 3) Gitee 鍚屾 + 涓婁紶 app-universal
  # ============================================================
  gitee-sync-and-release:
    runs-on: ubuntu-latest
    needs: build-and-github-release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get Git commit hash
        run: echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get Repository Info
        run: |
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          REPO_OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          echo "GIT_REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "GIT_REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV

      - name: Download APK artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: app-universal-release
          path: app/build/outputs/apk/

      - name: Sync Github Repos To Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/${{env.GIT_REPO_OWNER}}
          dst: gitee/${{env.GIT_REPO_OWNER}}
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: user
          clone_style: "https"
          debug: true
          force_update: true
          static_list: "${{env.GIT_REPO_NAME}}"
          timeout: "600s"

      - name: Create Gitee release
        id: create_gitee_release
        run: |
          RELEASE_ID=$(curl -X POST \
            --header 'Content-Type: application/json;charset=UTF-8' \
            "https://gitee.com/api/v5/repos/${{ env.GIT_REPO_OWNER }}/${{ env.GIT_REPO_NAME }}/releases" \
            -d '{
              "access_token":"${{ secrets.GITEE_TOKEN }}",
              "tag_name":"${{ github.ref_name }}",
              "name":"Release ${{ github.ref_name }}",
              "body":"${{ github.ref_name }}. Built from commit ${{ env.GIT_COMMIT_HASH }}. \n https://github.com/${{ env.GIT_REPO_OWNER }}/${{ env.GIT_REPO_NAME }}/releases/tag/${{ github.ref_name }}",
              "target_commitish":"main"
            }' | jq '.id')
          echo "GITEE_RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          echo "Release ID: $RELEASE_ID"

      - name: Upload APK to Gitee
        run: |
          for apk in app/build/outputs/apk/full/release/app-full-universal-release.apk app/build/outputs/apk/lite/release/app-lite-universal-release.apk; do
          curl -X POST "https://gitee.com/api/v5/repos/${{ env.GIT_REPO_OWNER }}/${{ env.GIT_REPO_NAME }}/releases/${{ env.GITEE_RELEASE_ID }}/attach_files" \
            -H "Authorization: Bearer ${{ secrets.GITEE_TOKEN }}" \
            -F "file=@${apk}"
          done
