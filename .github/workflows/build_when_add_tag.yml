name: Android CI (tag)

on:
  push:
    tags:
      # 正式版：普通 v* tag（排除预览后缀，预览版走
      # build_when_add_preview_tag.yml 发布为 Pre-release）
      - "v*"
      - "!v*-preview*"
      - "!v*-beta*"
    # branches: ["main"]

# ---------------------------------------------------------------------
# Go 服务器打包策略
#
# · 默认 SQLite 驱动是 gorm.io/driver/sqlite（底层 mattn/go-sqlite3），必 CGO。
# · 直接一套二进制：CGO_ENABLED=1 + go build（不使用 ObjectBox）。
# · database.type 配置项可选：sqlite / mysql / postgres。
#
# 平台范围（仅 Linux + Windows）：
#   linux/amd64     ubuntu-latest + 原生 gcc
#   linux/arm64     ubuntu-latest + gcc-aarch64-linux-gnu 交叉工具链
#   windows/amd64   windows-latest + MinGW-w64
#
# macOS 用户若需要二进制，按仓库 README 的指引用 data_server/build.sh 本地构建即可
# （Darwin 原生：brew install go gcc ; ./build.sh），CI 不再打 darwin 以避免
# osxcross/ld64 维护成本。
# ---------------------------------------------------------------------

jobs:
  # ============================================================
  # 1) Go 服务器（统一构建）
  #    独立 job、独立 runner，不与 APK/Keystore/gradlew 混，
  #    这样即便 APK 构建卡住，Go 二进制仍能单独出来。
  # ============================================================
  build-data-server:
    name: "Data Server · ${{ matrix.label }}"
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: x86_64-linux-gnu-gcc
            install_cmd: |
              set -eux
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl
            ext: ""

          - label: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            install_cmd: |
              set -eux
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl \
                gcc-aarch64-linux-gnu \
                libc6-dev-arm64-cross
            ext: ""

          - label: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc
            install_cmd: |
              $ErrorActionPreference = "Continue"
              # 1) MinGW-w64 gcc：依次尝试常见安装路径（runner 可能预装 msys2）
              $candidates = @(
                "C:\ProgramData\mingw64\bin",
                "C:\Program Files\mingw-w64\x86_64-8.1.0-posix-seh-rt_v6-rev0\mingw64\bin",
                "C:\msys64\ucrt64\bin",
                "C:\msys64\mingw64\bin",
                "C:\tools\msys64\ucrt64\bin",
                "C:\tools\msys64\mingw64\bin"
              )
              $found = $null
              foreach ($p in $candidates) { if (Test-Path (Join-Path $p "gcc.exe")) { $found = $p; break } }
              if (-not $found) {
                choco install -y mingw --prefer-binary --no-progress --timeout 600 || $null
                foreach ($p in $candidates) { if (Test-Path (Join-Path $p "gcc.exe")) { $found = $p; break } }
              }
              if (-not $found) {
                foreach ($msys in @("C:\msys64","C:\tools\msys64")) {
                  if (-not (Test-Path $msys)) { continue }
                  & "$msys\usr\bin\bash.exe" -lc "pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-gcc" || $null
                  $ucrt = "$msys\ucrt64\bin"
                  if (Test-Path (Join-Path $ucrt "gcc.exe")) { $found = $ucrt; break }
                }
              }
              if (-not $found) { throw "MinGW-w64 gcc not found on this runner." }
              Write-Host "FOUND gcc at: $found"
              echo $found | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.25"
          cache-dependency-path: data_server/go.sum

      - name: Install toolchain (${{ matrix.label }})
        working-directory: data_server
        run: ${{ matrix.install_cmd }}

      - name: Sanity go list packages
        working-directory: data_server
        shell: bash
        run: |
          set -eux
          go list ./... > /dev/null

      - name: Build data_server (${{ matrix.label }})
        working-directory: data_server
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          set -eux
          mkdir -p dist
          BIN="dist/xcimoc-data-server-${{ matrix.label }}${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$BIN" .
          ls -lh dist/
          echo "BIN_PATH=data_server/$BIN" >> "$GITHUB_ENV"

      - name: Upload artifact ${{ matrix.label }}
        uses: actions/upload-artifact@v6
        with:
          name: data-server-${{ matrix.label }}
          path: ${{ env.BIN_PATH }}

  # ============================================================
  # 2) APK 构建 + 上传默认产物（config.example.yaml 等）
  #    这部分与原逻辑保持一致，只是不再混打 Go 二进制。
  # ============================================================
  build-and-github-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-data-server # 先确认 Go 3 个目标都 OK，再建 Release（避免空 Release）

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "zulu"
          cache: gradle

      - name: Get Git commit hash
        id: git_commit_hash
        run: echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get Repository Info
        run: |
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          REPO_OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          echo "GIT_REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "GIT_REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.25"
          cache-dependency-path: data_server/go.sum

      # 只负责把 data_server 的配置示例和 3 个二进制（从 artifact 下载回来）
      # 放进 data_server/dist/ 目录，供最终 action-gh-release 一次性上传。
      - name: Collect Go server artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: data-server-*
          path: data_server/dist_raw/
          merge-multiple: true

      - name: Stage data_server/dist for release
        run: |
          set -eux
          cd data_server
          mkdir -p dist
          # 把各 artifact 扁平化到 dist/
          if [ -d dist_raw ]; then
            find dist_raw -maxdepth 2 -type f -exec cp -f {} dist/ \;
          fi
          cp -f config.example.yaml dist/
          ls -lh dist/

      - name: Upload Data Sync Server as artifact (batch)
        uses: actions/upload-artifact@v6
        with:
          name: data-server-binaries
          path: data_server/dist/

      - name: Create keystore file from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/xcimoc.jks

      - name: Grant execute permission for build.sh
        run: chmod +x build.sh

      - name: Build APK with build.sh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build.sh

      - name: Upload APK as artifact (for Gitee job)
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-release
          path: app/build/outputs/apk/release/app-universal-release.apk

      - name: Extract latest changelog
        run: python3 scripts/extract_changelog.py

      # 这里一次性把 APK + Go 二进制 + config 示例 挂到 Release 上。
      # 注意：data_server/dist/* 已在 build-data-server job 中通过 append release
      #       单独追加过一次；这里再写一次文件清单是为了兼容「某些标签先出
      #       APK 后出 Go 二进制」的 case，并保证 config.example.yaml 一定进 Release。
      - name: Create GitHub Release (APK + Go binaries batch)
        uses: softprops/action-gh-release@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          prerelease: false
          body_path: release_body.md
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/apk/release/app-x86-release.apk
            data_server/dist/xcimoc-data-server-linux-amd64
            data_server/dist/xcimoc-data-server-linux-arm64
            data_server/dist/xcimoc-data-server-linux-amd64-musl
            data_server/dist/xcimoc-data-server-linux-arm64-musl
            data_server/dist/xcimoc-data-server-windows-amd64.exe
            data_server/dist/config.example.yaml

  # ============================================================
  # 3) Gitee 同步 + 上传 app-universal
  # ============================================================
  gitee-sync-and-release:
    runs-on: ubuntu-latest
    needs: build-and-github-release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get Git commit hash
        run: echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get Repository Info
        run: |
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          REPO_OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
          echo "GIT_REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "GIT_REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV

      - name: Download APK artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: app-universal-release
          path: app/build/outputs/apk/release/

      - name: Sync Github Repos To Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/${{env.GIT_REPO_OWNER}}
          dst: gitee/${{env.GIT_REPO_OWNER}}
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: user
          clone_style: "https"
          debug: true
          force_update: true
          static_list: "${{env.GIT_REPO_NAME}}"
          timeout: "600s"

      - name: Create Gitee release
        id: create_gitee_release
        run: |
          RELEASE_ID=$(curl -X POST \
            --header 'Content-Type: application/json;charset=UTF-8' \
            "https://gitee.com/api/v5/repos/${{ env.GIT_REPO_OWNER }}/${{ env.GIT_REPO_NAME }}/releases" \
            -d '{
              "access_token":"${{ secrets.GITEE_TOKEN }}",
              "tag_name":"${{ github.ref_name }}",
              "name":"Release ${{ github.ref_name }}",
              "body":"${{ github.ref_name }}. Built from commit ${{ env.GIT_COMMIT_HASH }}. \n https://github.com/${{ env.GIT_REPO_OWNER }}/${{ env.GIT_REPO_NAME }}/releases/tag/${{ github.ref_name }}",
              "target_commitish":"main"
            }' | jq '.id')
          echo "GITEE_RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          echo "Release ID: $RELEASE_ID"

      - name: Upload APK to Gitee
        run: |
          curl -X POST "https://gitee.com/api/v5/repos/${{ env.GIT_REPO_OWNER }}/${{ env.GIT_REPO_NAME }}/releases/${{ env.GITEE_RELEASE_ID }}/attach_files" \
            -H "Authorization: Bearer ${{ secrets.GITEE_TOKEN }}" \
            -F "file=@app/build/outputs/apk/release/app-universal-release.apk"
