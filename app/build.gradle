import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'io.objectbox'
apply from: rootProject.file('check_r8_keep.gradle')

//// 输出过时 API 的具体位置（-Xlint:deprecation），便于排查弃用警告
//tasks.withType(JavaCompile).configureEach {
//    options.compilerArgs += ['-Xlint:deprecation']
//}

def getGitTagName = { ->
    try {
        def process = 'git describe --tags'.execute()
        process.waitFor()
        def output = process.text.trim()
        return output ? output : "v1.0.0"
    } catch (Exception ignored) {
        return "v1.0.0"
    }
}

def getGitCommitCount = { ->
    try {
        // 使用 Groovy 原生的 execute() 方法
        def process = 'git rev-list --count HEAD'.execute()
        process.waitFor()
        def output = process.text.trim()
        return output ? output.toInteger() : 1
    } catch (Exception ignored) {
        return 1 // 默认提交计数
    }
}

// 动态生成版本号
def buildVersion = getGitCommitCount()
def version = getGitTagName()
if (System.getenv("CI_BUILD_NUMBER") != null) { // 兼容 CI/CD
    buildVersion = System.getenv("CI_BUILD_NUMBER").toInteger()
}

// 从环境变量获取签名配置（用于 CI）
def _keystorePassword = System.getenv("KEYSTORE_PASSWORD")
def _keyAlias = System.getenv("KEY_ALIAS")
def _keyPassword = System.getenv("KEY_PASSWORD")

android {
    compileSdk 37
    namespace = "com.xyrlsz.xcimocob"
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
    defaultConfig {
        applicationId "com.xyrlsz.xcimocob"
        minSdkVersion 21
        targetSdkVersion 37
        versionCode buildVersion // 动态生成的版本号
        versionName version
        resourceConfigurations += ['en', 'zh']
        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "REPOSITORIE_NAME", '"XCimoc"'
        buildConfigField "String", "OWNER_NAME", '"xyrlsz"'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

    }

    signingConfigs {
        release {
            // 优先使用环境变量（CI 环境），否则使用本地文件（本地开发）
            if (_keystorePassword != null && _keyAlias != null && _keyPassword != null) {
                // CI 环境：使用从 secrets 创建的 keystore 文件
                def keystoreFile = file("../xcimoc.jks")
                if (keystoreFile.exists()) {
                    storeFile keystoreFile
                    storePassword _keystorePassword
                    keyAlias _keyAlias
                    keyPassword _keyPassword
                } else {
                    println "Warning: Keystore file not found at ${keystoreFile.absolutePath}"
                }
            } else {
                // 本地开发环境：使用本地 keystore
                def localKeystoreFile = file("../xcimoc.jks")
                if (localKeystoreFile.exists()) {
                    storeFile localKeystoreFile
                    storePassword '123456'
                    keyAlias 'xc'
                    keyPassword '123456'
                }
            }
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
        debug {
            storeFile file("../xcimoc.jks")
            storePassword '123456'
            keyAlias 'xc'
            keyPassword '123456'
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            buildConfigField "boolean", "USE_FINAL_RESOURCE_IDS", "true"
        }
        debug {
            minifyEnabled false
            signingConfig = signingConfigs.debug
            buildConfigField "boolean", "USE_FINAL_RESOURCE_IDS", "true"
        }
    }
    splits {
        abi {
            enable = true // 启用 ABI 分架构编译
            reset() // 重置所有 ABI 配置
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' // 包含的 ABI 类型
            universalApk = true // 是否生成包含所有 ABI 的通用 APK
        }
    }

    sourceSets {
        main {
            // 只打包 App 运行需要的 JS 源文件：index.json + sources/** + source_sdk.js。
            // 文件由 syncJsSources 任务从子模块复制到 build 生成目录，
            // 排除子模块里的开发工具（README/scripts/debug 等）。
            assets.srcDirs += "$buildDir/generated/assets/js-sources"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError = true
        fatal "NewApi"
        // 分析依赖库（AAR）字节码，供自定义 Lint 检测器（如 R8LibraryReflection）使用
        checkDependencies = true
    }
}

// 只打包需要的 JS 源文件：从子模块复制 index.json / source_sdk.js / sources/** 到
// build 生成目录作为 assets 源，避免把 README/scripts/debug 等开发工具一并打进 APK。
tasks.register('syncJsSources', Copy) {
    from('../xcimoc-js-sources') {
        include 'index.json'
        include 'source_sdk.js'
        include 'sources/**'
    }
    into layout.buildDirectory.dir('generated/assets/js-sources')
}

tasks.named('preBuild') {
    dependsOn 'syncJsSources'
}

